<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hello, Cricut</title>
<style>
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:#f1f1ec;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;
  padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
h1{margin:0;font-size:22px;font-weight:500;line-height:1.3;max-width:18em}
.hands{display:flex;gap:14px;width:100%;max-width:360px}
.hands button{flex:1;font-family:inherit;font-size:19px;font-weight:500;line-height:1;padding:22px 0;border-radius:14px;border:1px solid #f1f1ec;background:transparent;color:#f1f1ec;cursor:pointer}
.hands button:active{background:#f1f1ec;color:#000}
.hands button:focus-visible{outline:2px solid #9fe6ff;outline-offset:3px}
.tip{margin:0;max-width:20em;font-size:14px;line-height:1.5;color:#8e9298}
.n{font-size:min(42vw,200px);font-weight:700;line-height:1}
#count p{margin:0;font-size:18px;max-width:16em}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000;touch-action:none}
</style>
</head>
<body>

<main id="start" class="screen">
  <h1>Which hand are you holding your phone in?</h1>
  <div class="hands">
    <button type="button" id="left">Left</button>
    <button type="button" id="right">Right</button>
  </div>
  <p class="tip">Tip: the darker the room and the brighter your screen, the better.</p>
</main>

<div id="count" class="screen" hidden>
  <div class="n" id="countN">5</div>
  <p>Place your phone face down on top of the box.</p>
</div>

<canvas id="stage" hidden aria-label="Hologram"></canvas>
<video id="vid" src="floo-message.mp4" playsinline preload="auto"
  style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none"></video>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const cv = $("stage"), ctx = cv.getContext("2d"), vid = $("vid");
// Mapping into the box (units: 0.01 in). Reflection reverses one axis, so the picture is mirrored.
// The hand only decides which way the phone's top ends up, so it turns the picture 180°.
let turn = 0, W = 0, H = 0, dpr = 1, raf = 0, timer = 0, wl = null, playing = false;

function resize(){
  dpr = Math.min(3, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
}
window.addEventListener("resize", resize); resize();

function frame(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.translate(W / 2, H / 2);
  ctx.rotate((((H > W ? 90 : 0) + turn) % 360) * Math.PI / 180);
  const s = Math.min(W, H) / 2.7 / 100;
  ctx.scale(-s, s);
  if (vid.readyState >= 2){
    const h = 360, w = h * (vid.videoWidth / vid.videoHeight || 9 / 16);
    ctx.drawImage(vid, -w / 2, -h / 2, w, h);
  }
  raf = requestAnimationFrame(frame);
}

function show(id){ for (const k of ["start", "count"]) $(k).hidden = k !== id; cv.hidden = id !== "stage"; }
async function wake(){ try { if (navigator.wakeLock) wl = await navigator.wakeLock.request("screen"); } catch(e) {} }
function release(){ try { if (wl) wl.release(); } catch(e) {} wl = null; }

function begin(hand){
  turn = hand === "left" ? 180 : 0;
  wake();
  // unlock sound while we still have the tap
  try { vid.muted = false; vid.currentTime = 0; const p = vid.play(); if (p) p.then(() => { vid.pause(); vid.currentTime = 0; }).catch(() => {}); } catch(e) {}
  show("count");
  let n = 5; $("countN").textContent = n;
  clearInterval(timer);
  timer = setInterval(() => {
    if (--n > 0){ $("countN").textContent = n; return; }
    clearInterval(timer);
    resize(); show("stage"); playing = true;
    vid.currentTime = 0;
    vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); });
    cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
  }, 1000);
}
function reset(){
  clearInterval(timer); cancelAnimationFrame(raf); playing = false;
  try { vid.pause(); } catch(e) {}
  release(); show("start");
}
vid.addEventListener("ended", () => { if (playing) reset(); });
$("left").addEventListener("click", () => begin("left"));
$("right").addEventListener("click", () => begin("right"));
$("count").addEventListener("click", reset);
cv.addEventListener("click", reset);
document.addEventListener("visibilitychange", () => { if (!document.hidden && playing) wake(); });
})();
</script>
</body>
</html>
